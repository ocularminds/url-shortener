<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">URL Shortener</title>
  <desc id="description">Two interlocking links on a dark rounded square</desc>
  <defs>
    <linearGradient id="background" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#background)"/>
  <circle cx="102" cy="26" r="14" fill="#22d3ee" opacity=".08"/>
  <circle cx="24" cy="104" r="20" fill="#818cf8" opacity=".08"/>
  <g transform="rotate(-35 64 64)" fill="none" stroke-width="11" filter="url(#glow)">
    <rect x="18" y="45" width="64" height="38" rx="19" stroke="#22d3ee"/>
    <rect x="46" y="45" width="64" height="38" rx="19" stroke="#818cf8"/>
  </g>
</svg>
