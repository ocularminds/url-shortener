<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a compact, shareable URL.">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Fast · private · focused</p>
        <h1 id="page-title">Make a long link easier to share.</h1>
        <p class="lede">Paste an HTTP or HTTPS address and receive a compact link in seconds.</p>

        <form id="shorten-form" novalidate>
          <label for="url">Destination URL</label>
          <div class="input-row">
            <input
              id="url"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="url"
              maxlength="2048"
              placeholder="https://example.com/a/long/path"
              required
            >
            <button id="submit" type="submit">Shorten</button>
          </div>
        </form>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <div id="result" class="result" hidden>
          <span>Your short link</span>
          <a id="short-link" href="/" rel="noopener"></a>
          <button id="copy" class="secondary" type="button">Copy</button>
        </div>
      </section>
    </main>
  </body>
</html>
